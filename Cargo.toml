[workspace]
members = ["benchmark"]

[package]
name = "loole"
version = "0.6.0"
edition = "2021"
# Verified floor: library and test suite both build on 1.85. (The library
# alone builds back to 1.84; the test tree needs 1.85 because cargo only
# learned to parse edition2024 manifests — used by transitive dev-deps via
# rand 0.10 -> chacha20 -> cpufeatures — in that version.)
rust-version = "1.85"
description = "A safe async/sync multi-producer, multi-consumer channel"
repository = "https://github.com/mahdi-shojaee/loole"
documentation = "https://docs.rs/loole"
keywords = ["async", "sync", "channel", "mpmc", "mpsc"]
categories = ["asynchronous", "concurrency", "data-structures"]
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["/.*"]

[dependencies]
futures-sink = { version = "0.3", default-features = false }
futures-core = { version = "0.3", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
async-std = { version = "1.13.2", features = ["attributes", "unstable"] }
futures = { version = "^0.3", features = ["std"] }
crossbeam-utils = "0.8.22"
rand = "0.10.2"
